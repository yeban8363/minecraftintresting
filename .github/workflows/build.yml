name: build

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: polnyi-pizdec-jar
          path: build/libs/*.jar
      - name: Publish release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest build/libs/*.jar \
            --title "Полный Пиздец (последняя сборка)" \
            --notes "Скачай .jar ниже и положи в .minecraft/mods вместе с Fabric API для 1.21.1. Нужен Fabric Loader для Minecraft 1.21.1." \
            --target "${{ github.sha }}"
